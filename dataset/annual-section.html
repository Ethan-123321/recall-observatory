<template v-if="page===4">
<div class="sample-banner"><b>2025年1月1日 — 12月31日</b><span>官方栏目年度目录 · 采集于 {{annual.retrieved_date}} · 按公告发布日期统计</span></div>
<div class="stats">
<article><small>年度目录已采集</small><strong>{{annual.catalogue_count}}<em>/ {{annual.official_list_total}} 条</em></strong><span>{{annual.list_page_count}}页全部遍历 · 来源栏目目录核对</span></article>
<article><small>正文已下载</small><strong>{{annualDownloaded}}<em>份</em></strong><span>保留原始HTML与内容哈希</span></article>
<article><small>关键字段已提取</small><strong>{{annualStructured}}<em>份</em></strong><span>规则提取完成，仍需语义复核</span></article>
<article><small>正文缺失或字段待补核</small><strong>{{annual.catalogue_count-annualStructured}}<em>份</em></strong><span>查看下方状态筛选与原文</span></article>
</div>
<section class="card annual-boundary"><h2>目录完整，是否就等于全国完整？</h2><p>已核对本栏目2025年查询返回的全部{{annual.official_list_total}}条目录。它反映的是<strong>该栏目公告的发布分布</strong>，尚未完成全国召回事件逐一对应、扩大召回及更正公告的事件级合并。</p><p>全国官方年度通告另统计：消费品召回 <b>{{annual.national.recall_events.toLocaleString()}} 次</b>（同比下降1.7%），涉及 <b>823.6万件</b>（同比增长81.3%）。全国召回次数与栏目公告条数口径不同，不能相除作为覆盖率，也不能把公告增加解读为事故增多。</p><a :href="annual.national.source_url" target="_blank" rel="noopener">查看全国2025年度官方通告 ↗</a></section>
<section class="card"><h2>2025年栏目公告发布分布</h2><p class="hint">每条目录公告计一次；点击柱形查看当月公告。图表不受下方关键词或正文状态筛选影响，始终显示全年目录。</p><div ref="annualTimeline" class="chart tall"></div></section>
<section class="card"><h2>每个月采集到了哪一步？</h2><p class="hint">“字段提取”检查生产者、产品、型号、生产日期、缺陷、后果与措施是否取得有效文字，不等于内容核验正确。“关联旧版复核”仅表示标题与发布日期一致，尚未逐字段确认新版正文是否变化。</p><div class="annual-table-scroll"><table class="annual-table"><thead><tr><th>月份</th><th>目录条数</th><th>正文下载</th><th>字段提取</th><th>关联旧版复核</th><th>目录状态</th></tr></thead><tbody><tr v-for="m in annual.months" :class="{selected:annualMonth===m.month}"><td><button @click="annualMonth=annualMonth===m.month?'':m.month">{{m.month}}</button></td><td>{{m.listed}}</td><td>{{m.downloaded}}</td><td>{{m.structured}}</td><td>{{m.matched_reviewed}}</td><td>{{annual.catalogue_complete?'已遍历':'待补齐'}}</td></tr></tbody></table></div></section>
<section class="card list">
<h2>年度公告目录与原文</h2>
<div class="annual-filters"><label>年度目录关键词<input v-model="annualQuery" placeholder="生产者、品牌、产品或型号"></label><label>年度目录月份<select v-model="annualMonth"><option value="">全年</option><option v-for="m in annual.months">{{m.month}}</option></select></label><label>年度正文状态<select v-model="annualStatus"><option>全部</option><option>正文已提取</option><option>正文已下载·字段待补核</option><option>正文获取失败</option></select></label><button @click="annualQuery='';annualMonth='';annualStatus='全部'">清除年度筛选</button></div>
<p class="hint" aria-live="polite">{{annualRows.length}}条结果 · {{annualMonth||'2025全年'}} · 点击公告查看提取字段与证据</p>
<button class="notice-row" v-for="r in annualPaged" :key="r.id" @click="annualDetail=r"><div class="notice-date">2025<b>{{r.published_date.slice(5)}}</b></div><div class="notice-body"><h3>{{r.title}}</h3><p>{{r.extraction_status}} · {{r.review_status}}</p><small v-if="r.existing_reviewed_ids.length">已关联旧版复核记录；新版字段仍需对照</small></div><span>↗</span></button>
<p v-if="!annualRows.length" class="waiting">没有匹配的公告，请调整月份或关键词。</p>
<div class="pagination"><button @click="annualPage--" :disabled="annualPage<=1">上一页</button><span>{{annualPage}} / {{annualPageCount}} 页</span><button @click="annualPage++" :disabled="annualPage>=annualPageCount">下一页</button></div>
</section>
</template>
<dialog ref="annualDialog" @click.self="annualDetail=null" @close="annualDetail=null"><template v-if="annualDetail"><button class="close" @click="annualDetail=null" aria-label="关闭年度公告">×</button><div class="eyebrow">2025 / OFFICIAL CATALOGUE</div><h2>{{annualDetail.title}}</h2><p>{{annualDetail.published_date}} · {{annualDetail.extraction_status}}</p><div class="action-note">以下为规则提取的原文字段，待逐条语义复核。缺失批次不能直接理解为全批次召回，也不能据此自动判断产品是否涉及召回。</div><dl><template v-for="(label,key) in {producer:'生产者',product_name:'产品名称',brand:'品牌',model_raw:'型号 / 规格',production_dates_raw:'生产日期',batch_raw:'批次',quantity_raw:'数量原文',defect_raw:'缺陷',consequence_raw:'可能后果',remedy_raw:'召回措施'}"><dt>{{label}}</dt><dd>{{annualDetail[key]||'尚未取得有效文字，请核对官方原文'}}</dd></template></dl><p class="hint" v-if="annualDetail.error">{{annualDetail.error}}</p><p v-for="flag in annualDetail.quality_flags" class="error">{{flag}}</p><details><summary>采集依据</summary><p>目录页码：{{annualDetail.catalogue_page}} · 采集日期：{{annualDetail.retrieved_date}}</p><p>目录日期：{{annualDetail.published_date}} · 正文发布日期：{{annualDetail.detail_published_date||'未取得'}}</p><p>关联旧版记录：{{annualDetail.existing_reviewed_ids.join('、')||'无'}}</p><p class="annual-hash">SHA256：{{annualDetail.sha256||'未取得正文'}}</p></details><a class="source" :href="annualDetail.source_url" target="_blank" rel="noopener">查看官方公告原文 ↗</a></template></dialog>
